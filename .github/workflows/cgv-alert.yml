# CGV 예매 오픈 알리미 - GitHub Actions 예약 실행
# 5분마다 실행되어, 매 실행마다 약 4분간(1분 간격) CGV 시간표를 조회합니다.
name: CGV Alert

on:
  schedule:
    - cron: "*/5 * * * *"     # 5분마다 (GitHub 부하에 따라 지연될 수 있음)
  workflow_dispatch:          # Actions 탭에서 수동 실행 가능

concurrency:
  group: cgv-alert            # 이전 실행이 끝나기 전에 겹쳐 실행되지 않도록
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install requests curl_cffi

      # 이미 알린 회차 기록(seen.json)을 이전 실행에서 이어받음
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: cgv-state-${{ github.run_id }}
          restore-keys: cgv-state-

      - name: Check CGV
        run: python cgv_alert.py --duration ${{ vars.DURATION_MIN || '4' }}
        env:
          STATE_DIR: state
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: cgv-state-${{ github.run_id }}
